<sc-if value="{{isCfu5}}" hint-placeholder-val="{{ false }}">
<svg class="{{fadeCls}}" width="500" height="230" viewBox="0 0 500 230" style="position: absolute; left: 650px; top: 120px" aria-label="Isosceles trapezium ABCD with AB 6 cm, CD 10 cm, AD 5 cm and BC unknown">
<polygon points="154,48.4 346,48.4 410,195 90,195" fill="rgba(196,180,246,0.75)" stroke="#17375e" stroke-width="5" stroke-linejoin="round"></polygon>
<path d="M131.4,122.5 L115.0,115.3 M129.0,128.0 L112.6,120.8 M385.0,115.3 L368.6,122.5 M387.4,120.8 L371.0,128.0" stroke="#8e44d6" stroke-width="3" stroke-linecap="round"></path>
<path d="M244,42.4 L250,48.4 L244,54.4 M244,189 L250,195 L244,201" fill="none" stroke="#f08a24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="154" cy="48.4" r="7" fill="#fff" stroke="#17375e" stroke-width="3"></circle><circle cx="346" cy="48.4" r="7" fill="#fff" stroke="#17375e" stroke-width="3"></circle><circle cx="410" cy="195" r="7" fill="#fff" stroke="#17375e" stroke-width="3"></circle><circle cx="90" cy="195" r="7" fill="#fff" stroke="#17375e" stroke-width="3"></circle>
<text x="136" y="32" font-family="Nunito, sans-serif" font-weight="900" font-size="21" fill="#123b63">A</text>
<text x="352" y="32" font-family="Nunito, sans-serif" font-weight="900" font-size="21" fill="#123b63">B</text>
<text x="416" y="222" font-family="Nunito, sans-serif" font-weight="900" font-size="21" fill="#123b63">C</text>
<text x="68" y="222" font-family="Nunito, sans-serif" font-weight="900" font-size="21" fill="#123b63">D</text>
<text x="250" y="36" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="19" fill="#123b63">6 cm</text>
<text x="250" y="222" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="19" fill="#123b63">10 cm</text>
<text x="96" y="118" text-anchor="end" font-family="Nunito, sans-serif" font-weight="900" font-size="19" fill="#123b63">5 cm</text>
<text x="404" y="118" font-family="Nunito, sans-serif" font-weight="900" font-size="26" fill="#6a2bb0">?</text>
</svg>
</sc-if>

<sc-if value="{{hasOpts}}" hint-placeholder-val="{{ false }}">
<div class="{{fadeCls}}" style="position: absolute; left: 650px; top: {{optTop}}px; width: 504px; display: flex; gap: 12px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button class="opt {{o.cls}}" data-qa="opt-{{o.id}}" disabled="{{o.dis}}" onClick="{{o.pick}}" style="flex-grow: 1; flex-basis: 0; height: 74px; padding: 4px 8px; line-height: 1.15">{{o.t}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isCfu4}}" hint-placeholder-val="{{ false }}">
<svg class="{{fadeCls}}" width="180" height="90" viewBox="0 0 180 90" style="position: absolute; left: 662px; top: 127px" aria-label="Purple trapezium with legs of different lengths"><polygon points="10,78 170,78 160,14 40,14" fill="#cdbaf3" stroke="#6f4cc0" stroke-width="3.5" stroke-linejoin="round"></polygon><path d="M96,8 L102,14 L96,20 M96,72 L102,78 L96,84" fill="none" stroke="#d9640a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<svg class="{{fadeCls}}" width="180" height="90" viewBox="0 0 180 90" style="position: absolute; left: 662px; top: 231px" aria-label="Green trapezium with equal legs"><polygon points="15,78 165,78 125,14 55,14" fill="#a8e6c1" stroke="#23803f" stroke-width="3.5" stroke-linejoin="round"></polygon><path d="M42.3,47.6 L30.4,40.2 M39.6,51.8 L27.7,44.4 M149.6,40.2 L137.7,47.6 M152.3,44.4 L140.4,51.8" stroke="#1d6b35" stroke-width="2.5" stroke-linecap="round"></path><path d="M86,8 L92,14 L86,20 M86,72 L92,78 L86,84" fill="none" stroke="#d9640a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<svg class="{{fadeCls}}" width="180" height="90" viewBox="0 0 180 90" style="position: absolute; left: 662px; top: 335px" aria-label="Pink trapezium with two right angles"><polygon points="20,78 165,78 125,14 20,14" fill="#f7a8c8" stroke="#b8457a" stroke-width="3.5" stroke-linejoin="round"></polygon><path d="M20,28 L34,28 L34,14 M34,78 L34,64 L20,64" fill="none" stroke="#b8457a" stroke-width="2.5"></path><path d="M70,8 L76,14 L70,20 M88,72 L94,78 L88,84" fill="none" stroke="#d9640a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="3">
<button class="slot {{sl.cls}}" data-qa="slot-{{sl.id}}" onClick="{{sl.tap}}" aria-label="{{sl.aria}}" style="left: 868px; top: {{sl.y}}px">{{sl.t}}</button>
</sc-for>
<sc-for list="{{labs}}" as="lb" hint-placeholder-count="3">
<button class="lab {{lb.cls}}" data-qa="lab-{{lb.id}}" onPointerDown="{{lb.down}}" aria-label="{{lb.t}}" style="left: {{lb.x}}px; top: {{lb.y}}px">{{lb.t}}</button>
</sc-for>
</sc-if>

<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
<div class="{{fadeCls}}" style="position: absolute; left: 670px; top: 140px; width: 460px; height: 360px; border-radius: 28px; background: rgba(255,255,255,0.9); border: 3px solid #cfe6f7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 10px 30px rgba(18,59,99,0.15)">
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 42px; line-height: 1.05; color: #123b63; text-align: center">Lesson complete!</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{stars}}" as="st" hint-placeholder-count="3">
<svg class="star {{st.cls}}" width="62" height="62" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.3l-5.8 3 1.1-6.4-4.7-4.6 6.5-.9z" fill="currentColor" stroke="#c48f05" stroke-width="0.8" stroke-linejoin="round"></path></svg>
</sc-for>
</div>
<div style="font-weight: 800; font-size: 20px; color: #123b63; text-align: center; max-width: 360px">{{scoreText}}</div>
<button class="next" onClick="{{restart}}" style="margin-top: 6px">Play again</button>
</div>
</sc-if>

<div style="position: absolute; left: 640px; top: 528px; width: 520px; height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none">
<sc-for list="{{chips}}" as="cp" hint-placeholder-count="1">
<div class="chip {{cp.k}}">{{cp.t}}</div>
</sc-for>
</div>

<sc-if value="{{hintShow}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 640px; top: 84px; width: 520px; display: flex; justify-content: center; pointer-events: none">
<div class="hint {{hintCls}}" data-qa="hint"><span class="dot"></span>{{hintText}}</div>
</div>
</sc-if>

<img class="{{birdCls}}" src="assets/images/swiftee.webp" alt="Swiftee the bird" style="position: absolute; left: 44px; top: 452px; width: 212px; height: 234px; pointer-events: none">
<div class="{{bubCls}}" style="position: absolute; left: 172px; top: 214px; width: 446px; height: 220px; transform-origin: 11% 100%; pointer-events: none">
<img src="assets/images/speech-bubble.webp" alt="" style="position: absolute; left: 0px; top: 0px; width: 446px; height: 220px">
<div aria-live="polite" style="position: absolute; left: 26px; top: 14px; width: 394px; height: 146px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; column-gap: 7px; row-gap: 0px; font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: {{wordSize}}px; line-height: 1.2; color: #123b63; text-align: center" data-qa="bubble">
<sc-for list="{{words}}" as="wd" hint-placeholder-count="6">
<span class="w {{wd.cls}}">{{wd.t}}</span>
</sc-for>
</div>
</div>
<button class="ibtn" aria-label="Replay narration" onClick="{{replay}}" style="position: absolute; left: 588px; top: 200px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
</button>

<sc-if value="{{showNav}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 860px; top: 652px; width: 312px; height: 60px; display: flex; justify-content: flex-end; align-items: center; gap: 14px">
<button class="ibtn" aria-label="Back" data-qa="back" disabled="{{backDisabled}}" onClick="{{back}}" style="width: 54px; height: 54px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<button class="next {{nextCls}}" data-qa="next" disabled="{{nextDisabled}}" onClick="{{next}}">{{nextLabel}}<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</sc-if>

<sc-if value="{{notStarted}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background: rgba(18,59,99,0.28); display: flex; align-items: center; justify-content: center">
<div style="width: 560px; padding: 36px 40px 40px; border-radius: 32px; background: rgba(255,255,255,0.95); border: 3px solid #cfe6f7; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 18px 40px rgba(18,59,99,0.25)">
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 54px; line-height: 1; color: #123b63">Trapeziums</div>
<div style="font-weight: 800; font-size: 20px; color: #35597a; text-align: center">Extend sides, drag corners and discover what makes a trapezium special.</div>
<button class="startbtn" data-qa="start" onClick="{{start}}" style="margin-top: 8px"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor"></path></svg>Start</button>
<div style="font-weight: 700; font-size: 15px; color: #4f6f8c">Turn your sound on to hear the narration.</div>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
var Component = window.TrapeziumGame;
</script>
<script src="js/stage-fit.js"></script>
</body>
</html>
