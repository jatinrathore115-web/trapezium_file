<canvas class="swiftee-sprite" width="256" height="256" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 259px; height: 259px"></canvas>
</div>
<div class="bubble {{bubCls}} {{bubHide}}" style="position: absolute; left: 240px; bottom: 322px; pointer-events: none">
<div aria-live="polite" class="bubble-text" style="font-size: {{wordSize}}px" data-qa="bubble">
<sc-for list="{{words}}" as="wd" hint-placeholder-count="6">
<span class="w {{wd.cls}}">{{wd.t}}</span>
</sc-for>
</div>
<svg class="bubble-tail" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M2,-1 L7.5,25 L26,-1" fill="#fdf6e4" stroke="#2a9a8c" stroke-width="3" stroke-linejoin="round" stroke-linecap="butt"></path></svg>

</div>

<sc-if value="{{showNav}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 860px; top: 652px; width: 312px; height: 60px; display: flex; justify-content: flex-end; align-items: center; gap: 14px">
<button class="ibtn {{backCls}}" aria-label="Back" data-qa="back" disabled="{{backDisabled}}" onClick="{{back}}" style="width: 54px; height: 54px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<button class="next {{nextCls}}" data-qa="next" disabled="{{nextDisabled}}" onClick="{{next}}">{{nextLabel}}<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</sc-if>

<button class="navbtn screens-btn" data-qa="screens" aria-label="{{screensLabel}}" onClick="{{toggleScreens}}" style="position: absolute; left: 24px; top: 16px">{{screensLabel}}</button>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{ false }}">
<div class="screens-scrim" onClick="{{closeScreens}}"></div>
<div class="screens-panel" role="dialog" aria-label="All screens">
<sc-for list="{{thumbs}}" as="th" hint-placeholder-count="6">
<button class="{{th.cls}}" data-qa="thumb-{{th.n}}" title="{{th.title}}" aria-label="{{th.title}}" onClick="{{th.go}}"><img src="{{th.src}}" alt="" loading="lazy"><span class="thumb-n">{{th.n}}</span></button>
</sc-for>
</div>
</sc-if>

<div class="topnav" style="position: absolute; right: 24px; top: 16px; display: flex; gap: 10px">
<button class="navbtn" data-qa="nav-back" aria-label="Back" disabled="{{navBackDis}}" onClick="{{navBack}}">Back</button>
<button class="navbtn" data-qa="nav-next" aria-label="Next" disabled="{{navNextDis}}" onClick="{{navNext}}">Next</button>
</div>

<div class="walker" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 120px; height: 120px; pointer-events: none; visibility: hidden; z-index: 12"><canvas width="512" height="512" style="width: 100%; height: 100%; display: block"></canvas></div>

<canvas class="confetti" width="1280" height="720" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; pointer-events: none; z-index: 15"></canvas>

<sc-if value="{{handOn}}" hint-placeholder-val="{{ false }}">
<div class="{{hand.cls}}" style="left: {{hand.x}}px; top: {{hand.y}}px; --dx: {{hand.dx}}px; --dy: {{hand.dy}}px" aria-hidden="true">
<span class="hand-ring"></span>
<span class="hand-move"><img src="assets/images/hand-nudge.webp" alt=""></span>
</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
var Component = window.TrapeziumGame;
</script>
<script src="js/stage-fit.js"></script>
<script src="js/snowfall.js"></script>
<script src="js/confetti.js"></script>
</body>
</html>
